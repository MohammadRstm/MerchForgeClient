# ---- Real client IP ----
#
# This container sits behind the host's own nginx, so $remote_addr is the Docker
# gateway on every request, not the visitor. Rate limiting on that would be one
# shared bucket for the entire internet - a single noisy client would throttle
# every real user - so the limit below is keyed on the forwarded address instead.
#
# set_real_ip_from names who is allowed to *assert* that address. It is the whole
# security of this mechanism: X-Forwarded-For is client-supplied and trivially
# spoofed, so it is trusted only when the immediate peer is inside Docker's own
# private ranges - i.e. the host proxy. A request arriving from anywhere else
# keeps its real peer address and cannot forge its way into someone else's bucket.
#
# This requires the host vhost to actually send the header. If it does not, every
# request falls back to the gateway address and the limit becomes global - see
# docs/deployment notes; verify with `curl -sI https://merchforge.site/api/health`
# after deploying rather than assuming.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ---- Rate limiting ----
#
# The application's own limiter (ASP.NET, see Program.cs) is per-business and
# per-user, which is the right boundary for authenticated abuse but only applies
# *after* a request has been routed, authenticated and matched to a controller.
# This one is per-IP and applies before any of that, so unauthenticated flooding
# is dropped at the edge rather than being paid for in .NET and database time.
#
# 30r/s with a burst of 60 is deliberately far above real use: the dashboard's
# overview page alone issues twelve concurrent requests on load, and a burst that
# clipped it would look like a broken app. This bounds a flood, not a user.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- Security headers ----
    #
    # `always` so they are sent on error responses too, not just 2xx - an attacker
    # probing for a 404 or a 500 should get the same protections as a real visitor.
    #
    # nosniff matters more than it looks here: product images used to be served by
    # the API's static-file handler, which set it. They now come from R2, which
    # sends neither this nor a CSP, so byte-signature validation on upload became
    # the only remaining defence for those. This restores the header for everything
    # still served through the app itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;

    # HSTS is set here rather than at the host proxy so it travels with the image:
    # any host this container is put behind gets it without extra configuration.
    # No `preload` - that is a one-way submission to browser vendors and should be
    # a deliberate decision, not a side effect of a deploy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Deliberately no Content-Security-Policy yet. A wrong one silently breaks the
    # app in production - the storefront templates, R2 image origins and Google
    # Fonts all need to be enumerated first - so it wants its own change with
    # report-only testing behind it, not a guess bundled into a hardening pass.

    # The backend's own routes are already prefixed "api/..." ([Route("api/[controller]")]
    # in DashboardController etc.), so proxy_pass with no path component forwards the
    # request URI unchanged -- /api/Dashboard/stats stays /api/Dashboard/stats on its
    # way to the api container, no rewriting needed on either side.
    location /api/ {
        # nodelay so a legitimate burst (the overview page's twelve parallel
        # requests) is served immediately rather than queued into a slow trickle -
        # the burst allowance absorbs it, and only sustained excess is rejected.
        limit_req zone=api_rl burst=60 nodelay;

        # An explicit ceiling rather than nginx's 1 MB default, which product image
        # uploads can exceed. Bounded, not unlimited: an unbounded body is a way to
        # tie up the API with a single request.
        client_max_body_size 12m;

        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded product/template images, served by the api container's own
    # UseStaticFiles middleware -- same-origin proxy for the same reason as /api/.
    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Cache hashed build assets aggressively; index.html itself must always be
    # revalidated so a deploy is visible on next load instead of being cached stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # react-router handles routing client-side -- any path that isn't a real static
    # file (e.g. a refresh on /admin/templates) falls back to index.html instead of
    # 404ing, and the app's own router takes it from there.
    location / {
        try_files $uri /index.html;
    }
}
