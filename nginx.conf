server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router): any path that isn't a real static
    # file falls back to index.html rather than a 404 from nginx itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets (Vite hashes filenames) are safe to cache
    # aggressively - a new deploy ships new filenames, not new bytes under an
    # old one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
}
